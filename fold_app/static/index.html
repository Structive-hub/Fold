<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="fold-token" content="__FOLD_TOKEN__">
  <title>Fold — Bollette elettriche</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Fold, archivio bollette">fold<small>Il tuo archivio di casa</small></a>
    <div class="top-actions"><a class="button quiet" href="/api/backup">Esporta una copia</a><button class="button primary" id="upload">Aggiungi PDF</button></div>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden aria-label="Seleziona una bolletta PDF">
  </header>
  <div class="workspace">
    <nav class="archive-strip" aria-label="Archivio corrente"><strong>Bollette elettriche <span class="count" id="archive-count">0</span></strong><span>Documenti conservati su questo computer</span></nav>
    <main id="main" tabindex="-1"><p class="muted" role="status">Apro l’archivio…</p></main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <div class="dialog-heading"><h2 id="editor-title">Verifica un dato</h2><button class="close" type="button" id="cancel" aria-label="Chiudi">×</button></div>
      <p id="editor-description" class="muted"></p>
      <label id="alternatives-label" hidden><span id="alternatives-title">Valori letti nel documento</span><select id="alternatives"><option value="">Inserisci una correzione</option></select></label>
      <label>Valore<input id="edit-value" required maxlength="100" autocomplete="off"></label>
      <label>Motivo o dichiarazione<textarea id="edit-note" required maxlength="1000" rows="3" placeholder="Indica che cosa hai verificato o perché correggi questo dato."></textarea></label>
      <p class="hint">La versione precedente e la fonte vengono conservate. La modifica riguarda soltanto questo dato.</p>
      <div id="edit-error" role="alert" class="form-error"></div>
      <button class="button primary full" id="save" type="submit">Salva la verifica</button>
    </form>
  </dialog>
</body>
</html>
